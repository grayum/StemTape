name: Check StemTape
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Syntax and data tests
        run: |
          npm run check
          npm test
      - name: Install browser QA dependency only
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Browser workflows and PDF
        run: |
          python3 scripts/serve.py > /tmp/stemtape-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          npm run test:browser
      - name: Ensure private files are not tracked
        run: python3 scripts/check-private-files.py
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Resolve base image, build, test hardening
        run: |
          docker pull nginx:stable-alpine
          base_image=$(docker image inspect --format '{{index .RepoDigests 0}}' nginx:stable-alpine)
          docker build --build-arg NGINX_IMAGE="$base_image" -t stemtape:0.3.0 .
          sh scripts/container-smoke.sh stemtape:0.3.0
